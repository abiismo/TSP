[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tsp-perfume-search"
version = "0.1.0"
description = "Buscador básico y avanzado para un catálogo académico de perfumes"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*"]
